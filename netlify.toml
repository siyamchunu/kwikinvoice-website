[[headers]]
  for = "/*"
  [headers.values]
    # Security Headers
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/public/css/*"
  [headers.values]
    # Long-term caching for CSS (1 year)
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "text/css; charset=utf-8"

[[headers]]
  for = "/public/js/*"
  [headers.values]
    # Long-term caching for JS (1 year)
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/public/images/*"
  [headers.values]
    # Long-term caching for images (1 year)
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/public/images/*.webp"
  [headers.values]
    # WebP images
    Content-Type = "image/webp"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/public/images/*.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/public/images/*.jpg"
  [headers.values]
    Content-Type = "image/jpeg"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/public/images/*.svg"
  [headers.values]
    Content-Type = "image/svg+xml"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    # Short caching for HTML pages (5 minutes)
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    # Homepage - short cache
    Cache-Control = "public, max-age=300, must-revalidate"

# Redirect old domain to new domain (301 permanent)
[[redirects]]
  from = "https://kwikinvoice.loggedon.co.za/*"
  to = "https://kwikinvoice.app/:splat"
  status = 301
  force = true
