<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Invoice icon -->
  <rect x="20" y="15" width="60" height="70" rx="4" fill="url(#logoGradient)" />
  <rect x="25" y="20" width="50" height="60" rx="2" fill="white" opacity="0.95" />
  
  <!-- Invoice lines -->
  <line x1="30" y1="30" x2="70" y2="30" stroke="#2563EB" stroke-width="2" stroke-linecap="round" />
  <line x1="30" y1="40" x2="70" y2="40" stroke="#2563EB" stroke-width="2" stroke-linecap="round" />
  <line x1="30" y1="50" x2="55" y2="50" stroke="#2563EB" stroke-width="2" stroke-linecap="round" />
  
  <!-- Checkmark -->
  <circle cx="70" cy="70" r="15" fill="#10B981" />
  <path d="M 63 70 L 68 75 L 77 65" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
</svg>
